<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <style>
        .grid-pasatiempos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .tarjeta-categoria {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
        }
        .tarjeta-categoria h4 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }
        .opcion-checkbox {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: normal;
        }
        .opcion-checkbox input {
            width: auto;
            margin-right: 5px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="contenedor" style="max-width: 900px;">
        <h1>Hola Flask + Jinja</h1>
        <p>Esta es mi primera aplicación Web utilizando Python y Flask.</p>

        <form action="/saludar" method="POST">
            <label for="nombre" style="text-align: left;">Dame tu nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre aquí..." required>

            <h3 style="text-align: left; margin-top: 25px;">Selecciona tus pasatiempos</h3>
            
            <div class="grid-pasatiempos">
                <!-- Deportivos -->
                <div class="tarjeta-categoria">
                    <h4>Deportivos</h4>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Fútbol"> Fútbol</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Béisbol"> Béisbol</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Ciclismo"> Ciclismo</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Caminar"> Caminar</label>
                </div>

                <!-- Culturales -->
                <div class="tarjeta-categoria">
                    <h4>Culturales</h4>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Lectura"> Lectura</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Música"> Música</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Pintura"> Pintura</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Teatro"> Teatro</label>
                </div>

                <!-- Esparcimiento -->
                <div class="tarjeta-categoria">
                    <h4>Esparcimiento</h4>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Cine"> Cine</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Videojuegos"> Videojuegos</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Viajar"> Viajar</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Series"> Series</label>
                </div>

                <!-- Sociales -->
                <div class="tarjeta-categoria">
                    <h4>Sociales</h4>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Reuniones"> Reuniones</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Fiestas"> Fiestas</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Convivir"> Convivir</label>
                    <label class="opcion-checkbox"><input type="checkbox" name="pasatiempos" value="Redes sociales"> Redes sociales</label>
                </div>
            </div>

            <label for="descripcion" style="text-align: left;">En pocas palabras, ¿qué te gusta hacer?</label>
            <textarea id="descripcion" name="descripcion" maxlength="100" placeholder="Máximo 100 caracteres"></textarea>

            <button type="submit">Saludar</button>
        </form>
    </div>
</body>
</html>
