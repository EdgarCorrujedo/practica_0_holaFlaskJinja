<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saludar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <div class="contenedor">
        <h1>¡Hola {{ nombre }}!</h1>
        <p>Bienvenido a tu primera aplicación Web con Flask y Jinja.</p>
        
        {% if pasatiempos %}
            <h3>Tus pasatiempos seleccionados:</h3>
            <ul style="text-align: left; display: inline-block;">
                {% for item in pasatiempos %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% if descripcion %}
            <p><strong>Lo que te gusta hacer:</strong> {{ descripcion }}</p>
        {% endif %}

        <br>
        <a href="/">Regresar</a>
    </div>
</body>
</html>
